name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile public CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          working_directory: cv/CV__ENG__redacted
          texlive_version: 2025
          os: debian

      - name: Add compiled CV to the site
        run: cp cv/CV__ENG__redacted/resume.pdf public/cv/stefano-zizzi-cv.pdf

      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
